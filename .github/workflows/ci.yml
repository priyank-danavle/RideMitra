name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: ridemitra_test
          MYSQL_USER: ridemitra_user
          MYSQL_PASSWORD: ridemitra_password
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USER: ridemitra_user
      DB_PASSWORD: ridemitra_password
      DB_NAME: ridemitra_test
      AUTH_JWT_SECRET: ci-jwt-secret-testing-phase-2-strictly-for-ci
      COOKIE_SECRET: ci-cookie-secret-testing-phase-2-strictly-for-ci
      NODE_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run format

      - name: Run Linting
        run: npm run lint

      - name: Run Type Checking
        run: npm run typecheck

      - name: Run Database Migrations
        run: npm run db:migrate

      - name: Run Automated Tests
        run: npm test

      - name: Run Production Builds
        run: npm run build
