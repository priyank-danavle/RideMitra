services:
  mysql:
    image: mysql:8.0
    container_name: ridemitra-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ridemitra_root_password}
      MYSQL_DATABASE: ${DB_NAME:-ridemitra_dev}
      MYSQL_USER: ${DB_USER:-ridemitra_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ridemitra_dev_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-ridemitra_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ridemitra-net

volumes:
  mysql_data:
    name: ridemitra_mysql_data

networks:
  ridemitra-net:
    name: ridemitra_network
    driver: bridge
